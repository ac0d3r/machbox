name: Lint Web

on:
  push:
    branches:
      - main
    paths:
      - "internal/report/web/**"
      - ".github/workflows/lint-web.yml"
  pull_request:
    paths:
      - "internal/report/web/**"
      - ".github/workflows/lint-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/report/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: internal/report/web/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint
