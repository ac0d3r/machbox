name: Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
      - "report/web/**"
      - "testdata/**"
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
      - "report/web/**"
      - "testdata/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare embed
        run: |
          mkdir -p core/assets/data/
          touch core/assets/data/placeholder

          mkdir -p report/web/dist
          touch report/web/dist/placeholder

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
