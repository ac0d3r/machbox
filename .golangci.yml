version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - revive
    - gosec
    - bodyclose
    - misspell
    - errorlint

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
      settings:
        hugeParam:
          sizeThreshold: 512
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net.Conn).Close
        - (net.Listener).Close
        - (io.Closer).Close
        - (io/fs.File).Close
        - (*os.File).Close
        - (*io.PipeWriter).Close
        - syscall.Close
        - os.Remove
        - os.RemoveAll
        - (*os.Process).Kill
        - (*github.com/Code-Hex/vz/v3.VirtioSocketListener).Close
        - (*github.com/ac0d3r/machbox/pkg/vm.VMInstance).Shutdown
        - (*github.com/ac0d3r/machbox/internal/agent.Client).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocyclo
          - funlen
          - gocritic

